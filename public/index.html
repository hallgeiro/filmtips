<!DOCTYPE html>
<html lang="nb">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="theme-color" content="#0f172a" />
	<title>Filmtips</title>
	<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

	<!-- Innlogging -->
	<section id="login" class="hidden min-h-screen flex items-center justify-center p-6">
		<form id="pin-login-form" class="w-full max-w-sm bg-slate-800 rounded-2xl p-6 space-y-4 shadow-xl">
			<h1 class="text-2xl font-bold">🎬 Filmtips</h1>
			<select id="login-user" class="w-full rounded-lg bg-slate-900 border border-slate-700 px-4 py-3"></select>
			<p id="login-help" class="text-slate-400 text-sm"></p>
			<input id="login-pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="PIN (6 siffer)"
				class="w-full rounded-lg bg-slate-900 border border-slate-700 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-amber-400" />
			<input id="login-pin2" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="Gjenta PIN"
				class="hidden w-full rounded-lg bg-slate-900 border border-slate-700 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-amber-400" />
			<p id="pin-login-error" class="text-red-400 text-sm hidden"></p>
			<button id="login-btn" class="w-full rounded-lg bg-amber-400 text-slate-900 font-semibold py-3 hover:bg-amber-300">Logg inn</button>
		</form>
	</section>

	<!-- Hovedapp -->
	<div id="app" class="hidden max-w-3xl mx-auto px-4 pb-16">
		<header class="sticky top-0 z-10 bg-slate-900/95 backdrop-blur py-3 flex items-center gap-3">
			<h1 class="text-xl font-bold shrink-0">🎬 Filmtips</h1>
			<select id="user" class="ml-auto min-w-0 rounded-lg bg-slate-800 border border-slate-700 px-3 py-2 text-sm">
			</select>
			<button id="admin" class="text-slate-400 hover:text-slate-200 text-sm" title="Admin"></button>
			<button id="logout" class="text-slate-400 hover:text-slate-200 text-sm" title="Logg ut">Logg ut</button>
		</header>

		<div id="admin-bar" class="hidden mb-3 text-sm text-slate-400 flex items-center gap-3">
		<span>Admin:</span>
		<button id="reset-pin" class="underline hover:text-slate-200">Nullstill PIN for valgt navn</button>
		<button id="import-clz" class="underline hover:text-slate-200">Importer CLZ-CSV…</button>
		<button id="rematch" class="underline hover:text-slate-200">Kryssjekk treff</button>
		<input id="clz-file" type="file" accept=".csv,text/csv" class="hidden" />
		<span id="import-status" class="text-amber-300"></span>
	</div>

	<nav class="flex gap-2 mb-4" role="tablist">
			<button data-tab="search" class="tab flex-1 rounded-lg py-2 px-1 text-xs sm:text-sm font-medium">🔍 Søk</button>
			<button data-tab="feed" class="tab flex-1 rounded-lg py-2 px-1 text-xs sm:text-sm font-medium">⭐ Anbefalinger</button>
			<button data-tab="library" class="tab flex-1 rounded-lg py-2 px-1 text-xs sm:text-sm font-medium">📀 Bibliotek</button>
			<button data-tab="nights" class="tab flex-1 rounded-lg py-2 px-1 text-xs sm:text-sm font-medium">🎬 Filmkveld</button>
		</nav>

		<section id="tab-search">
			<input id="q" type="search" placeholder="Søk etter film eller IMDb-kode (tt1234567)…" autocomplete="off"
				class="w-full rounded-lg bg-slate-800 border border-slate-700 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-amber-400" />
			<p id="search-status" class="text-slate-400 text-sm mt-3"></p>
			<div id="results" class="grid grid-cols-2 sm:grid-cols-3 gap-3 mt-3"></div>
		</section>

		<section id="tab-library" class="hidden">
			<button id="lib-add" class="hidden mb-3 w-full rounded-lg bg-emerald-600 py-3 text-sm font-semibold hover:bg-emerald-500">➕ Legg til film (strekkode eller tittel)</button>
			<div class="flex gap-2">
				<input id="lib-q" type="search" placeholder="Tittel, regissør eller IMDb-kode…" autocomplete="off"
					class="flex-1 min-w-0 rounded-lg bg-slate-800 border border-slate-700 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-amber-400" />
				<select id="lib-sort" class="rounded-lg bg-slate-800 border border-slate-700 px-2 text-sm" title="Sorter">
					<option value="title">Tittel A–Å</option>
					<option value="year_desc">År (nyest)</option>
					<option value="year_asc">År (eldst)</option>
					<option value="director">Regissør A–Å</option>
				</select>
			</div>
			<div id="lib-kinds" class="flex gap-2 mb-1"></div>
			<div id="lib-formats" class="flex flex-wrap gap-2 mt-3"></div>
			<select id="lib-decades" class="hidden mt-2 rounded-lg bg-slate-800 border border-slate-700 px-3 py-2 text-sm" title="Tiår"></select>
			<div id="lib-dir" class="mt-2"></div>
			<p id="lib-status" class="text-slate-400 text-sm mt-3"></p>
			<div id="lib-list" class="grid grid-cols-2 sm:grid-cols-3 gap-3 mt-3"></div>
			<button id="lib-more" class="hidden mt-4 w-full rounded-lg bg-slate-800 py-3 text-sm hover:bg-slate-700">Vis flere</button>
		</section>

		<section id="tab-nights" class="hidden">
			<div id="nights-list-view">
				<form id="night-form" class="hidden bg-slate-800 rounded-xl p-3 mb-4 space-y-2">
					<div class="text-sm font-semibold">Ny filmkveld</div>
					<input id="night-title" maxlength="100" placeholder="Tittel, f.eks. Fredagskveld" class="w-full rounded-lg bg-slate-900 px-3 py-2 text-base" />
					<input id="night-date" type="date" class="w-full rounded-lg bg-slate-900 px-3 py-2 text-base" />
					<input id="night-note" maxlength="500" placeholder="Notat (valgfritt), f.eks. tid og sted" class="w-full rounded-lg bg-slate-900 px-3 py-2 text-base" />
					<button class="w-full rounded-lg bg-amber-400 text-slate-900 font-semibold py-2">Opprett filmkveld</button>
				</form>
				<p id="nights-status" class="text-slate-400 text-sm mb-2"></p>
				<div id="nights-list" class="space-y-2"></div>
			</div>
			<div id="night-view" class="hidden">
				<button id="night-back" class="text-sm text-slate-400 hover:text-white mb-3">← Alle filmkvelder</button>
				<div id="night-head"></div>
				<div id="night-add" class="hidden mt-4">
					<input id="night-q" type="search" autocomplete="off" placeholder="Søk etter en film du ønsker å se…" class="w-full rounded-lg bg-slate-800 px-3 py-2 text-base" />
					<div id="night-results" class="mt-2 space-y-2"></div>
				</div>
				<h3 class="font-semibold mt-5 mb-2">Ønsker</h3>
				<div id="night-wishes" class="space-y-2"></div>
			</div>
		</section>

		<section id="tab-feed" class="hidden">
			<p id="feed-status" class="text-slate-400 text-sm"></p>
			<div id="feed" class="space-y-3"></div>
		</section>

		<footer class="mt-10 text-xs text-slate-500 space-y-1">
			<p>Filmdata fra <a class="underline" href="https://www.themoviedb.org" target="_blank" rel="noopener">TMDB</a>.
				Strømmedata fra <a class="underline" href="https://www.justwatch.com" target="_blank" rel="noopener">JustWatch</a>.
				Dette produktet bruker TMDB API, men er ikke godkjent eller sertifisert av TMDB.</p>
		</footer>
	</div>

	<!-- Legg til film med strekkode (admin) -->
	<div id="add-modal" class="hidden fixed inset-0 z-30 bg-black/70 flex items-end sm:items-center justify-center">
		<div class="bg-slate-800 w-full sm:max-w-xl max-h-[92vh] overflow-y-auto rounded-t-2xl sm:rounded-2xl p-5 space-y-3">
			<div class="flex items-center justify-between">
				<h2 class="text-lg font-bold">Legg til film</h2>
				<button id="add-close" class="text-2xl text-slate-400 hover:text-white" aria-label="Lukk">×</button>
			</div>
			<button id="add-scan" class="w-full rounded-lg bg-amber-400 text-slate-900 font-semibold py-3 hover:bg-amber-300">📷 Skann strekkode</button>
			<div id="scan-box" class="hidden rounded-lg overflow-hidden bg-black">
				<div id="scan-reader"></div>
				<button id="scan-stop" class="w-full py-2 text-sm text-slate-300 bg-slate-900">Stopp kamera</button>
			</div>
			<div class="flex gap-2">
				<input id="add-code" inputmode="numeric" placeholder="Strekkode (tall)" autocomplete="off"
					class="flex-1 min-w-0 rounded-lg bg-slate-900 border border-slate-700 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400" />
				<button id="add-lookup" class="rounded-lg bg-slate-900 border border-slate-700 px-3 text-sm hover:border-amber-400">Slå opp</button>
			</div>
			<input id="add-q" type="search" placeholder="…eller søk på tittel eller IMDb-kode" autocomplete="off"
				class="w-full rounded-lg bg-slate-900 border border-slate-700 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400" />
			<p id="add-status" class="text-sm text-slate-400"></p>
			<div id="add-results" class="space-y-2"></div>
			<div id="add-pick" class="hidden border-t border-slate-700 pt-3 space-y-3">
				<p id="add-picked" class="font-semibold"></p>
				<div id="add-formats" class="flex flex-wrap gap-2"></div>
				<button id="add-save" class="w-full rounded-lg bg-emerald-600 py-3 font-semibold hover:bg-emerald-500">Legg til i biblioteket</button>
			</div>
			<p id="add-error" class="text-red-400 text-sm hidden"></p>
		</div>
	</div>

	<!-- Rett match (admin) -->
	<div id="fix-modal" class="hidden fixed inset-0 z-30 bg-black/70 flex items-end sm:items-center justify-center">
		<div class="bg-slate-800 w-full sm:max-w-xl max-h-[92vh] overflow-y-auto rounded-t-2xl sm:rounded-2xl p-5 space-y-3">
			<div>
				<h2 class="text-lg font-bold">Rett match</h2>
				<p id="fix-title" class="text-sm text-slate-400"></p>
			</div>
			<input id="fix-q" type="search" placeholder="Søk i TMDB (tittel eller IMDb-kode)…" autocomplete="off"
				class="w-full rounded-lg bg-slate-900 border border-slate-700 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-amber-400" />
			<div id="fix-results" class="space-y-2"></div>
			<div class="flex gap-2">
				<input id="fix-id" placeholder="eller lim inn TMDB-lenke / ID"
					class="flex-1 min-w-0 rounded-lg bg-slate-900 border border-slate-700 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400" />
				<button id="fix-use-id" class="rounded-lg bg-slate-900 border border-slate-700 px-3 text-sm hover:border-amber-400">Bruk</button>
			</div>
			<p id="fix-error" class="text-red-400 text-sm hidden"></p>
			<div class="flex gap-2 pt-1">
				<button id="fix-clear" class="flex-1 rounded-lg bg-slate-900 border border-slate-700 py-3 text-sm text-red-300">Fjern match</button>
				<button id="fix-cancel" class="flex-1 rounded-lg bg-slate-900 border border-slate-700 py-3 text-sm">Avbryt</button>
			</div>
		</div>
	</div>

	<!-- PIN-dialog -->
	<div id="pin-modal" class="hidden fixed inset-0 z-30 bg-black/70 flex items-center justify-center p-4">
		<form id="pin-form" class="bg-slate-800 w-full max-w-sm rounded-2xl p-5 space-y-3">
			<h2 id="pin-title" class="text-lg font-bold"></h2>
			<p id="pin-help" class="text-sm text-slate-400"></p>
			<input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="PIN (6 siffer)"
				class="w-full rounded-lg bg-slate-900 border border-slate-700 px-4 py-3 text-center tracking-widest focus:outline-none focus:ring-2 focus:ring-amber-400" />
			<div id="pin2-wrap" class="hidden">
				<input id="pin2" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="Gjenta PIN"
					class="w-full rounded-lg bg-slate-900 border border-slate-700 px-4 py-3 text-center tracking-widest focus:outline-none focus:ring-2 focus:ring-amber-400" />
			</div>
			<p id="pin-error" class="text-red-400 text-sm hidden"></p>
			<div class="flex gap-2">
				<button type="button" id="pin-cancel" class="flex-1 rounded-lg bg-slate-900 border border-slate-700 py-3">Avbryt</button>
				<button class="flex-1 rounded-lg bg-amber-400 text-slate-900 font-semibold py-3 hover:bg-amber-300">OK</button>
			</div>
		</form>
	</div>

	<!-- Detaljark -->
	<div id="modal" class="hidden fixed inset-0 z-20 bg-black/70 flex items-end sm:items-center justify-center">
		<div class="relative w-full sm:max-w-xl">
			<button id="modal-close" class="absolute top-2 right-2 z-10 w-11 h-11 rounded-full bg-slate-700 shadow-lg text-2xl leading-none text-slate-200 hover:text-white" aria-label="Lukk">×</button>
			<div class="bg-slate-800 max-h-[92dvh] overflow-y-auto overscroll-contain rounded-t-2xl sm:rounded-2xl p-5">
				<div id="modal-body"></div>
			</div>
		</div>
	</div>

	<script src="/app.js"></script>
</body>
</html>
